syntax = "proto3";
import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";
import "src/haxorg/serde/SemOrgProto.proto";

package org.graph.proto;

message MapNodePayload {
  orgproto.AnyNode node = 1;
}

message MapEdgePayload {
  enum EdgeKind {
    DIRECT_LINK = 0;
    NESTED_STATEMENT_ELEMENT = 1;
    NESTED_SUBTREE = 2;
  }

  EdgeKind kind = 1;
}


message MapEdgeCollectionPayload {

};
