version: v2

clean: true

plugins:
  - remote: buf.build/protocolbuffers/cpp
    out: generated/hstd

  - remote: buf.build/community/chrusty-jsonschema
    out: build/jsonschema/hstd
    opt:
      # prefixes each generated schema filename with the protobuf package name.
      - prefix_schema_files_with_package
