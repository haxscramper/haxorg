syntax = "proto3";

package hstd.ext.geometry.proto;

import "buf/validate/validate.proto";
import "src/hstd/ext/geometry/hstd_geometry.proto";

enum GeometryAnchor {
  WHOLE_SHAPE = 0;
  UPPER_LEFT = 1;
  UPPER_CENTER = 2;
  UPPER_RIGHT = 3;
  CENTER_LEFT = 4;
  CENTER = 5;
  CENTER_RIGHT = 6;
  LOWER_LEFT = 7;
  LOWER_CENTER = 8;
  LOWER_RIGHT = 9;
}

enum GeometryDistanceCheck {
  DISTANCE_BOTH = 0;
  DISTANCE_X_ONLY = 1;
  DISTANCE_Y_ONLY = 2;
}

message GeometryElement {
  string id = 1 [(buf.validate.field).string.min_len = 1];

  oneof shape {
    option (buf.validate.oneof).required = true;

    Rect rect = 2;
    Point point = 3;
    Path path = 4;
  }
}

message GeometryElementRef {
  string id = 1 [(buf.validate.field).string.min_len = 1];

  GeometryAnchor anchor = 2 [(buf.validate.field).enum.defined_only = true];
}

message IntersectsCheck {
  GeometryElementRef first = 1 [(buf.validate.field).required = true];
  GeometryElementRef second = 2 [(buf.validate.field).required = true];
}

message LeftOfCheck {
  GeometryElementRef stationary = 1 [(buf.validate.field).required = true];
  GeometryElementRef relative = 2 [(buf.validate.field).required = true];
  optional double rtol = 3 [(buf.validate.field).double.gte = 0];
  optional double atol = 4 [(buf.validate.field).double.gte = 0];
}

message RightOfCheck {
  GeometryElementRef stationary = 1 [(buf.validate.field).required = true];
  GeometryElementRef relative = 2 [(buf.validate.field).required = true];
  optional double rtol = 3 [(buf.validate.field).double.gte = 0];
  optional double atol = 4 [(buf.validate.field).double.gte = 0];
}

message AboveCheck {
  GeometryElementRef stationary = 1 [(buf.validate.field).required = true];
  GeometryElementRef relative = 2 [(buf.validate.field).required = true];
  optional double rtol = 3 [(buf.validate.field).double.gte = 0];
  optional double atol = 4 [(buf.validate.field).double.gte = 0];
}

message BelowCheck {
  GeometryElementRef stationary = 1 [(buf.validate.field).required = true];
  GeometryElementRef relative = 2 [(buf.validate.field).required = true];
  optional double rtol = 3 [(buf.validate.field).double.gte = 0];
  optional double atol = 4 [(buf.validate.field).double.gte = 0];
}

message PartiallyAboveCheck {
  GeometryElementRef stationary = 1 [(buf.validate.field).required = true];
  GeometryElementRef relative = 2 [(buf.validate.field).required = true];

  double max_under_percent = 3 [
    (buf.validate.field).double.gte = 0,
    (buf.validate.field).double.lte = 100
  ];

  optional double rtol = 4 [(buf.validate.field).double.gte = 0];
  optional double atol = 5 [(buf.validate.field).double.gte = 0];
}

message PartiallyBelowCheck {
  GeometryElementRef stationary = 1 [(buf.validate.field).required = true];
  GeometryElementRef relative = 2 [(buf.validate.field).required = true];

  double max_over_percent = 3 [
    (buf.validate.field).double.gte = 0,
    (buf.validate.field).double.lte = 100
  ];

  optional double rtol = 4 [(buf.validate.field).double.gte = 0];
  optional double atol = 5 [(buf.validate.field).double.gte = 0];
}

message PartiallyLeftCheck {
  GeometryElementRef stationary = 1 [(buf.validate.field).required = true];
  GeometryElementRef relative = 2 [(buf.validate.field).required = true];

  double max_over_percent = 3 [
    (buf.validate.field).double.gte = 0,
    (buf.validate.field).double.lte = 100
  ];

  optional double rtol = 4 [(buf.validate.field).double.gte = 0];
  optional double atol = 5 [(buf.validate.field).double.gte = 0];
}

message PartiallyRightCheck {
  GeometryElementRef stationary = 1 [(buf.validate.field).required = true];
  GeometryElementRef relative = 2 [(buf.validate.field).required = true];

  double max_over_percent = 3 [
    (buf.validate.field).double.gte = 0,
    (buf.validate.field).double.lte = 100
  ];

  optional double rtol = 4 [(buf.validate.field).double.gte = 0];
  optional double atol = 5 [(buf.validate.field).double.gte = 0];
}

message FullyCoversCheck {
  GeometryElementRef main = 1 [(buf.validate.field).required = true];
  GeometryElementRef nested = 2 [(buf.validate.field).required = true];
  optional double rtol = 3 [(buf.validate.field).double.gte = 0];
  optional double atol = 4 [(buf.validate.field).double.gte = 0];
}

message PartiallyCoversCheck {
  GeometryElementRef main = 1 [(buf.validate.field).required = true];
  GeometryElementRef nested = 2 [(buf.validate.field).required = true];

  double overlap_percent = 3 [
    (buf.validate.field).double.gte = 0,
    (buf.validate.field).double.lte = 100
  ];

  optional double rtol = 4 [(buf.validate.field).double.gte = 0];
  optional double atol = 5 [(buf.validate.field).double.gte = 0];
}

message AlignedHorizontallyCheck {
  GeometryElementRef first = 1 [(buf.validate.field).required = true];
  GeometryElementRef second = 2 [(buf.validate.field).required = true];
  optional double tolerance = 3 [(buf.validate.field).double.gte = 0];
  optional double rtol = 4 [(buf.validate.field).double.gte = 0];
  optional double atol = 5 [(buf.validate.field).double.gte = 0];
}

message AlignedVerticallyCheck {
  GeometryElementRef first = 1 [(buf.validate.field).required = true];
  GeometryElementRef second = 2 [(buf.validate.field).required = true];
  optional double tolerance = 3 [(buf.validate.field).double.gte = 0];
  optional double rtol = 4 [(buf.validate.field).double.gte = 0];
  optional double atol = 5 [(buf.validate.field).double.gte = 0];
}

message MinDistanceCheck {
  GeometryElementRef first = 1 [(buf.validate.field).required = true];
  GeometryElementRef second = 2 [(buf.validate.field).required = true];

  double min_distance = 3 [(buf.validate.field).double.gte = 0];

  GeometryDistanceCheck distance_check = 4 [(buf.validate.field).enum.defined_only = true];

  optional double rtol = 5 [(buf.validate.field).double.gte = 0];
  optional double atol = 6 [(buf.validate.field).double.gte = 0];
}

message MaxDistanceCheck {
  GeometryElementRef first = 1 [(buf.validate.field).required = true];
  GeometryElementRef second = 2 [(buf.validate.field).required = true];

  double max_distance = 3 [(buf.validate.field).double.gte = 0];

  GeometryDistanceCheck distance_check = 4 [(buf.validate.field).enum.defined_only = true];

  optional double rtol = 5 [(buf.validate.field).double.gte = 0];
  optional double atol = 6 [(buf.validate.field).double.gte = 0];
}

message DistanceCheck {
  GeometryElementRef first = 1 [(buf.validate.field).required = true];
  GeometryElementRef second = 2 [(buf.validate.field).required = true];

  double distance = 3 [(buf.validate.field).double.gte = 0];

  GeometryDistanceCheck distance_check = 4 [(buf.validate.field).enum.defined_only = true];

  optional double rtol = 5 [(buf.validate.field).double.gte = 0];
  optional double atol = 6 [(buf.validate.field).double.gte = 0];
}

message SameSizeCheck {
  GeometryElementRef first = 1 [(buf.validate.field).required = true];
  GeometryElementRef second = 2 [(buf.validate.field).required = true];
  optional double tolerance = 3 [(buf.validate.field).double.gte = 0];
  optional double rtol = 4 [(buf.validate.field).double.gte = 0];
  optional double atol = 5 [(buf.validate.field).double.gte = 0];
}

message SameWidthCheck {
  GeometryElementRef first = 1 [(buf.validate.field).required = true];
  GeometryElementRef second = 2 [(buf.validate.field).required = true];
  optional double tolerance = 3 [(buf.validate.field).double.gte = 0];
  optional double rtol = 4 [(buf.validate.field).double.gte = 0];
  optional double atol = 5 [(buf.validate.field).double.gte = 0];
}

message SameHeightCheck {
  GeometryElementRef first = 1 [(buf.validate.field).required = true];
  GeometryElementRef second = 2 [(buf.validate.field).required = true];
  optional double tolerance = 3 [(buf.validate.field).double.gte = 0];
  optional double rtol = 4 [(buf.validate.field).double.gte = 0];
  optional double atol = 5 [(buf.validate.field).double.gte = 0];
}

message EquidistantCheck {
  repeated GeometryElementRef elements = 1 [(buf.validate.field).repeated.min_items = 3];

  optional double tolerance = 2 [(buf.validate.field).double.gte = 0];
}

message GeometryCheck {
  string id = 1 [(buf.validate.field).string.min_len = 1];

  oneof check {
    option (buf.validate.oneof).required = true;

    IntersectsCheck intersects = 2;
    LeftOfCheck left_of = 3;
    RightOfCheck right_of = 4;
    AboveCheck above = 5;
    BelowCheck below = 6;
    PartiallyAboveCheck partially_above = 7;
    PartiallyBelowCheck partially_below = 8;
    PartiallyLeftCheck partially_left = 9;
    PartiallyRightCheck partially_right = 10;
    FullyCoversCheck fully_covers = 11;
    PartiallyCoversCheck partially_covers = 12;
    AlignedHorizontallyCheck aligned_horizontally = 13;
    AlignedVerticallyCheck aligned_vertically = 14;
    MinDistanceCheck min_distance = 15;
    MaxDistanceCheck max_distance = 16;
    DistanceCheck distance = 17;
    SameSizeCheck same_size = 18;
    SameWidthCheck same_width = 19;
    SameHeightCheck same_height = 20;
    EquidistantCheck equidistant = 21;
  }
}

message GeometryValidationSpec {
  repeated GeometryElement elements = 1;
  repeated GeometryCheck checks = 2;
}
