syntax = "proto3";

import "buf/validate/validate.proto";

package hstd.ext.kiwi_ir.proto;

enum Axis {
  AXIS_X = 0;
  AXIS_Y = 1;
}

enum Anchor {
  ANCHOR_LEFT = 0;
  ANCHOR_HCENTER = 1;
  ANCHOR_RIGHT = 2;
  ANCHOR_TOP = 3;
  ANCHOR_VCENTER = 4;
  ANCHOR_BOTTOM = 5;
}

enum AnchorAxisRelative {
  ANCHOR_AXIS_RELATIVE_MIN_POS = 0;
  ANCHOR_AXIS_RELATIVE_MID_POS = 1;
  ANCHOR_AXIS_RELATIVE_MAX_POS = 2;
}

enum RectAttr {
  RECT_ATTR_X = 0;
  RECT_ATTR_Y = 1;
  RECT_ATTR_WIDTH = 2;
  RECT_ATTR_HEIGHT = 3;
  RECT_ATTR_LEFT = 4;
  RECT_ATTR_HCENTER = 5;
  RECT_ATTR_RIGHT = 6;
  RECT_ATTR_TOP = 7;
  RECT_ATTR_VCENTER = 8;
  RECT_ATTR_BOTTOM = 9;
}

enum Relation {
  RELATION_EQ = 0;
  RELATION_LE = 1;
  RELATION_GE = 2;
}

enum Strength {
  STRENGTH_REQUIRED = 0;
  STRENGTH_STRONG = 1;
  STRENGTH_MEDIUM = 2;
  STRENGTH_WEAK = 3;
}

message AnchorSpec {
  Anchor x = 1;
  Anchor y = 2;
}

message RectSpec2Side {
  string rect_id = 1;
  Anchor min_anchor = 2;
  Anchor max_anchor = 3;
}

message RectSpec1Side {
  string rect_id = 1;
  Anchor anchor = 2;
}

message KiwiTerm {
  string variable = 1;
  double coefficient = 2;
}

message KiwiExpression {
  repeated KiwiTerm terms = 1;
  double constant = 2;
}

message Expr {
  message VertexRectAttr {
    string vertex_stable_id = 1;
    RectAttr attr = 2;
  }

  message Node {
    message UnaryMath {
      Node value = 1;
    }

    message BinMath {
      Node lhs = 1;
      Node rhs = 2;
    }

    message Constant {
      double constant = 1;
    }

    message Expression {
      KiwiExpression expression = 1;
    }

    message Variable {
      oneof variable {
        option (buf.validate.oneof).required = true;
        string variable_name = 1;
        VertexRectAttr vertex_rect_attr = 2;
      }
    }

    oneof kind {
      option (buf.validate.oneof).required = true;
      BinMath add = 1;
      BinMath sub = 2;
      BinMath mul = 3;
      UnaryMath neg = 4;
      Expression expression = 5;
      Constant constant = 6;
      Variable variable = 7;
    }
  }

  Node node = 1;
}

message Constraint {
  Expr lhs = 1;
  Expr rhs = 2;
  Relation op = 3;
  optional double strength = 4;
}

message Rect {
  string rect_id = 1;
  optional double x0 = 2;
  optional double y0 = 3;
  optional double width0 = 4;
  optional double height0 = 5;
}

message EdgeDesc {
  string rect_id = 1;
  string label = 2;
  Axis axis = 3;
  optional string color = 4;
}

message Padding {
  double left = 1;
  double top = 2;
  double right = 3;
  double bottom = 4;
}

message AlignSpec {
  Anchor anchor = 1;
  double offset = 2;
}

message AlignItem {
  string rect_id = 1;
  AlignSpec spec = 2;
}

message AlignConstraint {
  repeated AlignItem items = 1;
  Strength strength = 2;
}

message SeparateConstraint {
  RectSpec1Side rect_a = 1;
  RectSpec1Side rect_b = 2;
  double offset = 3;
  Strength strength = 4;
}

message RectSpec1SideGroup {
  repeated RectSpec1Side items = 1;
}

message MultiSeparateConstraint {
  repeated RectSpec1SideGroup groups = 1;
  double step = 2;
  Strength strength = 3;
}

message ParentWrapConstraint {
  string parent_rect_id = 1;
  repeated string nested_rect_ids = 2;
  Padding pad = 3;
  Strength strength = 4;
}

message RelDimensionSpec {
  optional double size_factor = 1;
  optional double relative_offset = 2;
  double absolute_offset = 3;
}

message RelativeConstraint {
  string relative_rect_id = 1;
  string fixed_rect_id = 2;
  RelDimensionSpec x_dim = 3;
  RelDimensionSpec y_dim = 4;
  AnchorSpec anchor_fixed = 5;
  AnchorSpec anchor_relative = 6;
  Strength strength = 7;
}

message EvenGapConstraint {
  repeated RectSpec2Side rects_spec = 1;
  Strength strength = 2;
}

message EqualSizeConstraint {
  string rect_a_id = 1;
  string rect_b_id = 2;
  bool match_width = 3;
  bool match_height = 4;
  Strength strength = 5;
}

message LinearConstraint {
  Expr left = 1;
  Relation relation = 2;
  Expr right = 3;
  Strength strength = 4;
}

message ConstraintSpec {
  oneof kind {
    option (buf.validate.oneof).required = true;
    AlignConstraint align = 1;
    SeparateConstraint separate = 2;
    MultiSeparateConstraint multi_separate = 3;
    ParentWrapConstraint parent_wrap = 4;
    RelativeConstraint relative = 5;
    EvenGapConstraint even_gap = 6;
    EqualSizeConstraint equal_size = 7;
    LinearConstraint linear = 8;
  }
}

message ConstraintEntry {
  oneof source {
    option (buf.validate.oneof).required = true;
    string source_text = 1;
    ConstraintSpec constraint = 2;
  }

  repeated Constraint lowered = 3;
}
