exclude: |
  (?x)^(
    haxorg_cpp_c_wrap/src/haxorg_cpp_c_wrap/haxorg_c\.h|
    haxorg_cpp_c_wrap/src/haxorg_cpp_c_wrap/haxorg_c\.cpp|
    haxorg_cpp_c_wrap/src/haxorg_cpp_c_wrap/haxorg_c_vtables\.hpp|
    haxorg_cpp_c_wrap/src/haxorg_cpp_c_wrap/haxorg_c_vtables\.cpp|
    haxorg_wasm_lib_wrap/src/haxorg_wasm_lib_wrap/haxorg_wasm\.cpp|
    haxorg_wasm_lib_wrap/src/haxorg_wasm_lib_wrap/haxorg_wasm_types\.d\.ts|
    haxorg_py_lib/src/haxorg_py_lib/pyhaxorg\.pyi|
    haxrg_cpp_py_wrap/src/haxrg_cpp_py_wrap/pyhaxorg\.cpp|
    haxorg_cpp_org_lib/src/haxorg_cpp_org_lib/serde/SemOrgProto\.proto|
    haxorg_cpp_org_lib/src/haxorg_cpp_org_lib/serde/SemOrgSerdeDeclarations\.hpp|
    haxorg_cpp_org_lib/src/haxorg_cpp_org_lib/serde/SemOrgSerdeDefinitions\.cpp|
    haxorg_cpp_org_lib/src/haxorg_cpp_org_lib/exporters/Exporter\.tcc|
    haxorg_cpp_org_lib/src/haxorg_cpp_org_lib/imm/ImmOrgSerde\.tcc|
    haxorg_cpp_org_lib/src/haxorg_cpp_org_lib/imm/ImmOrgAdapterGenerated\.hpp|
    haxorg_cpp_org_lib/src/haxorg_cpp_org_lib/imm/ImmOrgAdapterGenerated\.cpp|
    haxorg_cpp_org_lib/src/haxorg_cpp_org_lib/exporters/ExporterMethods\.tcc|
    haxorg_cpp_org_lib/src/haxorg_cpp_org_lib/sem/SemOrgEnums\.hpp|
    haxorg_cpp_org_lib/src/haxorg_cpp_org_lib/sem/SemOrgEnums\.cpp|
    haxorg_cpp_org_lib/src/haxorg_cpp_org_lib/sem/SemOrgSharedTypes\.hpp|
    haxorg_cpp_org_lib/src/haxorg_cpp_org_lib/sem/SemOrgTypes\.hpp|
    haxorg_cpp_org_lib/src/haxorg_cpp_org_lib/imm/ImmOrgTypes\.hpp|
    hstd_cpp_lib/tests/tUnidataDSLModel\.cpp|
    hstd_cpp_lib/tests/tUnidataDSLModel\.hpp
  )$
repos:
  - repo: local
    hooks:
      - id: install-commit-message-hooks
        name: Install commit message hooks
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
        entry: >-
          bash -c 'hooks_dir=$(git rev-parse --git-path hooks);
          install -m 755 repo_py_validate/prepare_commit_message.py "$hooks_dir/prepare-commit-msg";
          install -m 755 repo_py_validate/validate_commit_message.py "$hooks_dir/commit-msg"'
  - repo: local
    hooks:
      - id: pre-commit-sg-rewrite
        name: Remove and unify code styles
        language: system
        entry: ast-grep scan --color=never -c repo_py_validate/sgconfig.yaml -U
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        exclude: ^\.clang-format$
  - repo: local
    hooks:
      - id: isort
        name: Format python imports
        entry: uv run --dev isort
        language: system
        types: [python]
        stages: [manual]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        name: ruff fix imports
        # I: sort and organize imports
        # F401: remove unused impots
        # UP035: import Sequence/Mapping from collections.abc instead of the typing
        #        -- was removed, this option cannot be used for automatic fixes as
        #        it fails to convert import of `Dict` to `dict` -- bad desing, a
        #        diagnostic that is auto-fixable is mixed with one that cannot be
        #        auto-fixed.
        args:
          - "--fix"
          - "--select=I,I001,F401"
          - "--fixable=I,I001,F401"

      - id: ruff-format

      - id: ruff-check
        name: ruff validate
        stages: [manual]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format -i
        language: system
        types_or: [c, c++, cuda]
  - repo: local
    hooks:
      - id: check-repo-tasks
        name: check-repo-tasks
        entry: uv run --dev ./scripts/py_repository/py_repository/repo_hooks/validate_repo_task_config.py
        language: system
        files: ^scripts/py_repository/py_repository/repo_tasks/.*\.json$
        stages: [manual]
  - repo: local
    hooks:
      - id: find-debug-calls
        name: Find debug calls
        entry: uv run --dev ./scripts/py_repository/py_repository/repo_hooks/validate_cxx_code.py
        language: system
        types: [c++]
        stages: [manual]
  - repo: https://github.com/BlankSpruce/gersemi-pre-commit
    rev: 0.29.1
    hooks:
    - id: gersemi
  - repo: local
    hooks:
      - id: no-undocumented-api
        name: Prevent undocumented Python/C++ functions/classes
        entry: uv run --dev ./scripts/py_repository/py_repository/repo_hooks/validate_documentation_changes.py
        language: system
        pass_filenames: true
        files: \.(py|h|hh|hpp|hxx|c|cc|cpp|cxx)$
        stages: [manual]
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: forbid-binary
