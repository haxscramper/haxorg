items:
  - name: "Trailing markup in subtree with tags"
    debug:
      doFlatParseCompare: false
    source: "**** COMPLETED Try =atmospace= :test##assesment##viability:"

  - name: "Trailing markup in subtree"
    debug:
      doFlatParseCompare: false
    source: "***** COMPLETED Update sizes of the setting grid element to use ~@scale~"

  - name: "Trailing colon for subtree name"
    debug:
      doFlatParseCompare: false
    source: "****** Pros:"

  - name: "Regular subtree"
    source: "* Subtree"
    base_tokens:
      - {kind: SubtreeStars, str: "*"}
      - {kind: Whitespace, str: " "}
      - {kind: Word, str: Subtree}

    tokens:
      - {kind: SubtreeStars, str: "*"}
      - {kind: Whitespace, str: " "}
      - {kind: Word, str: "Subtree"}

  - name: "Subtree with time annotations"
    source: "* [2023-03-05] Subtree title"
    tokens:
      - {kind: SubtreeStars, str: "*"}
      - {kind: Whitespace, str: " "}
      - {kind: BraceBegin, str: "["}
      - {kind: Date, str: "2023-03-05"}
      - {kind: BraceEnd, str: "]"}
      - {kind: Whitespace, str: " "}
      - {kind: Word, str: Subtree}
      - {kind: Whitespace, str: " "}
      - {kind: Word, str: title}

  - name: "Subtree with nested content"
    source: "** CLI Tools\n\nNested content"
    tokens:
      - {kind: SubtreeStars, str: "**"}
      - {kind: Whitespace, str: " "}
      - {kind: BigIdent, str: "CLI"}
      - {kind: Whitespace, str: " "}
      - {kind: Word, str: "Tools"}
      - {kind: MediumNewline, str: "\n\n"}
      - {kind: Word, str: Nested}
      - {kind: Whitespace, str: " "}
      - {kind: Word, str: content}

  - name: "Headline after paragraph"
    debug:
      doFlatParseCompare: false
    source: |
      Paragraph text
      * New headline

    tokens:
      - {kind: Word, str: Paragraph}
      - {kind: Whitespace, str: " "}
      - {kind: Word, str: text}
      - {kind: Newline, str: "\n"}
      - {kind: SubtreeStars, str: "*"}
      - {kind: Whitespace, str: " "}
      - {kind: Word, str: New}
      - {kind: Whitespace, str: " "}
      - {kind: Word, str: headline}
      - {kind: Newline, str: "\n"}



  - name: "Lorem ipsum subtree"
    debug:
      doFlatParseCompare: false
      traceAll: true
    file: org/lorem_ipsum_subtree.org

  - name: "Nested lists in the subtree notes"
    debug:
      doLexBase: false
    source: |
      **** Title:
        :LOGBOOK:
        - Note taken on [2024-07-27 Sat 22:52:02 +04] \\
          Some note
        - Note taken on [2024-07-27 Sat 22:52:08 +04] \\
          Add note
          - List in the note
          - [2024-07-27 Sat 22:52:14 +04] Timestamp
        :END:

  - name: User-defined drawer
    debug:
      doLexBase: false
    source: |
      ** This is a headline

        Still outside the drawer

        :DRAWERNAME:
        This is inside the drawer.
        :END:
        After the drawer.

  - name: Subtree with all the features
    # I was informed that this is, in fact, legal.
    source: |
      * TODO [#A] Prepare quarterly report [2/6]                     :work:report:urgent:
      SCHEDULED: <2026-08-20 Thu +1w> DEADLINE: <2026-08-25 Tue -2d>
      CLOSED: [2026-08-16 Sun 09:00]
      :PROPERTIES:
      :CATEGORY: QuarterlyReport
      :EFFORT: 4:00
      :APPT_WARNTIME: 15
      :STYLE: habit
      :COOKIE_DATA: todo recursive
      :ID: 8b1e2f3a-report
      :END:
      :LOGBOOK:
      CLOCK: [2026-08-14 Fri 09:00]--[2026-08-14 Fri 10:30] =>  1:30
      CLOCK: [2026-08-15 Sat 09:00]--[2026-08-15 Sat 10:15] =>  1:15
      CLOCK: [2026-08-16 Sun 08:00]--[2026-08-16 Sun 09:00] =>  1:00
      :END:

      Meet on <2026-08-18 Tue 10:00> to align on numbers.
      Also check in on <2026-08-19 Wed 14:00-15:00> for a review call.
      Archive review will happen on <2026-08-21 Fri>.

      Last year's filing was [2025-08-20 Wed] (inactive, just for reference).

      %%(diary-float t 3 -1) Last Friday reminder: submit draft
