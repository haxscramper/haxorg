      <%%(diary-float t 1 2) 09:00-10:00>
      <%%(diary-block 8 20 2026 8 25 2026) all-day prep window>
      <%%(diary-day-of-year 230) Day-230 checkpoint>

      - [ ] Collect sales figures
      - [X] Collect marketing figures
      - [ ] Draft executive summary

