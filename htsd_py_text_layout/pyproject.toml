[build-system]
requires = [
  "hatchling>=1.27",
  "hstd-py-lib==0.1.0",
]
build-backend = "hatchling.build"

[project]
name = "htsd-py-text-layout"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "hstd-py-lib==0.1.0",
]

[tool.uv.sources]
hstd-py-lib = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/htsd_py_text_layout"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/pyproject.toml",
]

[tool.hatch.build.hooks.conan]
reference = "hstd_cpp_text_layout_py_wrap/0.1.0"
artifact = "py_textlayout_cpp*.so"
destination = ""
