syntax = "proto3";
import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";
import "haxorg_cpp_org_lib/SemOrgProto.proto";
import "haxorg_cpp_org_lib/OrgApiProto.proto";
import "hstd_cpp_lib/error_write.proto";
import "hstd_cpp_lib/graph_base.proto";

package org.graph.proto;

message MapNodePayload {
  orgproto.AnyNode node = 1;
}

message MapEdgePropPayload {

}

message MapEdgePayload {
  enum EdgeKind {
    DEFAULT = 0;
    DIRECT_LINK = 1;
    NESTED_STATEMENT_ELEMENT = 2;
    NESTED_SUBTREE = 3;
    DESCRIPTION_LIST_HEAD = 4;
  }

  EdgeKind kind = 1;
  optional orgproto.AnyNode node = 2;
}


message MapEdgeCollectionPayload {

};

message GraphResult {
  .hstd.ext.graph.proto.IGraph graph = 1;
  repeated .orgproto.ParseReport reports = 2;
  .orgproto.SourceManager sources = 3;
}
