name: Build a Conan package

on:
  workflow_call:
    inputs:
      package:
        description: Package name
        required: true
        type: string
      package-directory:
        description: Recipe directory relative to the repository root
        required: false
        default: ""
        type: string
      incoming-package:
        description: Package whose cumulative server snapshot precedes this job
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: write

jobs:
  package:
    name: ${{ inputs.package }}
    runs-on: ubuntu-latest

    container:
      image: fedora:latest

    defaults:
      run:
        shell: bash

    env:
      CI_SCRIPT: ${{ github.workspace }}/.github/scripts/conan_ci.py
      CACHE_PREFIX: conan-server-v2${{ inputs.package }}--
      CACHE_KEY: conan-server-v2${{ inputs.package }}--${{ github.run_id }}-${{ github.run_attempt }}
      UV_PYTHON: "3.13"
      UV_PYTHON_PREFERENCE: only-managed
      UV_PYTHON_DOWNLOADS: automatic


    steps:
      - name: Install system tools
        run: |
          dnf install -y \
            clang \
            gcc-c++ \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            python3-devel \
            nodejs \
            git \
            tar \
            gzip \
            make \
            pkgconf-pkg-config \
            patch

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv, managed Python, Conan, and Conan server
        run: |
          python3 -m venv "$RUNNER_TEMP/uv-venv"
          "$RUNNER_TEMP/uv-venv/bin/python" -m pip install uv

          UV="$RUNNER_TEMP/uv-venv/bin/uv"

          "$UV" python install "$UV_PYTHON"
          "$UV" venv --clear --python "$UV_PYTHON" "$RUNNER_TEMP/conan-venv"
          "$UV" pip install \
            --python "$RUNNER_TEMP/conan-venv/bin/python" \
            "conan>=2,<3" \
            conan-server

          echo "$RUNNER_TEMP/uv-venv/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/conan-venv/bin" >> "$GITHUB_PATH"

      - name: Restore previous package snapshot
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/conan-server-snapshot
          key: ${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}

      - name: Preserve previous package snapshot
        env:
          ACTION_PAYLOAD: >-
            {
              "temporary_directory": ${{ toJSON(runner.temp) }}
            }
        run: |
          python "$CI_SCRIPT" preserve_previous_snapshot "$ACTION_PAYLOAD"

      - name: Restore preceding job snapshot
        if: inputs.incoming-package != ''
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/conan-server-snapshot
          key: conan-server-v2${{ inputs.incoming-package }}--${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            conan-server-v2${{ inputs.incoming-package }}--${{ github.run_id }}-
          fail-on-cache-miss: true

      - name: Build, test, upload, and snapshot Conan package
        env:
          ACTION_PAYLOAD: >-
            {
              "package": ${{ toJSON(inputs.package) }},
              "package_directory": ${{ toJSON(inputs.package-directory || inputs.package) }},
              "workspace": "$GITHUB_WORKSPACE",
              "temporary_directory": "$RUNNER_TEMP",
              "server_port": 9300,
              "username": "ci",
              "password": "ci",
              "startup_timeout": 60.0,
              "shutdown_timeout": 30.0
            }
        run: |
          python "$GITHUB_WORKSPACE/.github/scripts/conan_ci.py" run_package "$ACTION_PAYLOAD"

      - name: Save successful server snapshot
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/conan-server-snapshot
          key: ${{ env.CACHE_KEY }}

      - name: Evict previous package cache entries
        if: ${{ env.ACT != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION_PAYLOAD: >-
            {
              "repository": ${{ toJSON(github.repository) }},
              "cache_prefix": ${{ toJSON(env.CACHE_PREFIX) }},
              "cache_key": ${{ toJSON(env.CACHE_KEY) }},
              "ref": ${{ toJSON(github.ref) }},
              "api_url": ${{ toJSON(github.api_url) }},
              "token_environment": "GH_TOKEN",
              "request_timeout": 30.0
            }
        run: |
          python "$CI_SCRIPT" evict_previous_caches "$ACTION_PAYLOAD"
