name: Build or verify a package

on:
  workflow_call:
    inputs:
      package:
        description: Package name
        required: true
        type: string
      package-directory:
        description: Package directory relative to the repository root
        required: false
        default: ""
        type: string
      python-package:
        description: Build and test a Python package instead of a Conan package
        required: false
        default: false
        type: boolean
      incoming-packages:
        description: JSON array of required upstream Conan packages
        required: false
        default: "[]"
        type: string

permissions:
  contents: read
  actions: write

jobs:
  package:
    name: ${{ inputs.package }}
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/haxscramper/conan-ci:latest

    defaults:
      run:
        shell: bash

    env:
      CI_SCRIPT: ${{ github.workspace }}/.github/scripts/conan_ci.py
      CACHE_SCRIPT: ${{ github.workspace }}/.github/scripts/conan_cache.cjs
      CACHE_PREFIX: conan-package-v1${{ inputs.package }}--
      CACHE_KEY: conan-package-v1${{ inputs.package }}--${{ github.run_id }}-${{ github.run_attempt }}
      UV_PYTHON: "3.13"
      UV_PYTHON_PREFERENCE: only-managed
      UV_PYTHON_DOWNLOADS: automatic

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Expose preinstalled tools at existing paths
        run: |
          ln -s /opt/uv-venv "$RUNNER_TEMP/uv-venv"
          ln -s /opt/conan-venv "$RUNNER_TEMP/conan-venv"
          ln -s /opt/conan-cache-client "$RUNNER_TEMP/conan-cache-client"

      - name: Restore individual Conan package archives
        uses: actions/github-script@v8
        env:
          ACTION_PAYLOAD: >-
            {
              "operation": "restore",
              "package": ${{ toJSON(inputs.package) }},
              "python_package": ${{ toJSON(inputs.python-package) }},
              "incoming_packages": ${{ inputs.incoming-packages }},
              "run_id": ${{ toJSON(github.run_id) }},
              "run_attempt": ${{ toJSON(github.run_attempt) }}
            }
        with:
          script: |
            const run = require(process.env.CACHE_SCRIPT);
            await run({core});

      - name: Build and test package
        env:
          ACTION_PAYLOAD: >-
            {
              "package": ${{ toJSON(inputs.package) }},
              "package_directory": ${{ toJSON(inputs.package-directory || inputs.package) }},
              "python_package": ${{ toJSON(inputs.python-package) }},
              "incoming_packages": ${{ inputs.incoming-packages }},
              "workspace": "$GITHUB_WORKSPACE",
              "temporary_directory": "$RUNNER_TEMP",
              "server_port": 9300,
              "username": "ci",
              "password": "ci",
              "startup_timeout": 60.0,
              "shutdown_timeout": 30.0
            }
        run: |
          python "$CI_SCRIPT" run_ci_package "$ACTION_PAYLOAD"

      - name: Save individual Conan package archive
        if: ${{ !inputs.python-package }}
        uses: actions/github-script@v8
        env:
          ACTION_PAYLOAD: >-
            {
              "operation": "save",
              "package": ${{ toJSON(inputs.package) }},
              "run_id": ${{ toJSON(github.run_id) }},
              "run_attempt": ${{ toJSON(github.run_attempt) }}
            }
        with:
          script: |
            const run = require(process.env.CACHE_SCRIPT);
            await run({core});

      - name: Evict previous package cache entries
        if: ${{ !inputs.python-package && env.ACT != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION_PAYLOAD: >-
            {
              "repository": ${{ toJSON(github.repository) }},
              "cache_prefix": ${{ toJSON(env.CACHE_PREFIX) }},
              "cache_key": ${{ toJSON(env.CACHE_KEY) }},
              "ref": ${{ toJSON(github.ref) }},
              "api_url": ${{ toJSON(github.api_url) }},
              "token_environment": "GH_TOKEN",
              "request_timeout": 30.0
            }
        run: |
          python "$CI_SCRIPT" evict_previous_caches "$ACTION_PAYLOAD"
