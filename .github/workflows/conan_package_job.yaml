name: Build or verify a package

on:
  workflow_call:
    inputs:
      package:
        description: Package name
        required: true
        type: string
      package-directory:
        description: Package directory relative to the repository root
        required: false
        default: ""
        type: string
      python-package:
        description: Build and test a Python package instead of a Conan package
        required: false
        default: false
        type: boolean
      incoming-packages:
        description: JSON array of required upstream Conan packages
        required: false
        default: "[]"
        type: string

permissions:
  contents: read
  actions: write

jobs:
  package:
    name: ${{ inputs.package }}
    runs-on: ubuntu-latest

    container:
      image: fedora:latest

    defaults:
      run:
        shell: bash

    env:
      CI_SCRIPT: ${{ github.workspace }}/.github/scripts/conan_ci.py
      CACHE_SCRIPT: ${{ github.workspace }}/.github/scripts/conan_cache.cjs
      CACHE_PREFIX: conan-package-v1${{ inputs.package }}--
      CACHE_KEY: conan-package-v1${{ inputs.package }}--${{ github.run_id }}-${{ github.run_attempt }}
      UV_PYTHON: "3.13"
      UV_PYTHON_PREFERENCE: only-managed
      UV_PYTHON_DOWNLOADS: automatic

    steps:
      - name: Install system tools
        run: |
          dnf install -y \
            clang \
            gcc-c++ \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            python3-devel \
            nodejs \
            npm \
            git \
            tar \
            gzip \
            zstd \
            make \
            lldb \
            pkgconf-pkg-config \
            patch

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install UV, managed Python, Conan, server, and cache client
        run: |
          python3 -m venv "$RUNNER_TEMP/uv-venv"
          "$RUNNER_TEMP/uv-venv/bin/python" -m pip install uv

          UV="$RUNNER_TEMP/uv-venv/bin/uv"

          "$UV" python install "$UV_PYTHON"
          "$UV" venv --clear --python "$UV_PYTHON" "$RUNNER_TEMP/conan-venv"
          "$UV" pip install \
            --python "$RUNNER_TEMP/conan-venv/bin/python" \
            "conan>=2,<3" \
            conan-server

          npm install \
            --prefix "$RUNNER_TEMP/conan-cache-client" \
            --no-package-lock \
            --no-save \
            @actions/cache

          echo "$RUNNER_TEMP/uv-venv/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/conan-venv/bin" >> "$GITHUB_PATH"

      - name: Restore individual Conan package archives
        uses: actions/github-script@v8
        env:
          ACTION_PAYLOAD: >-
            {
              "operation": "restore",
              "package": ${{ toJSON(inputs.package) }},
              "python_package": ${{ toJSON(inputs.python-package) }},
              "incoming_packages": ${{ inputs.incoming-packages }},
              "run_id": ${{ toJSON(github.run_id) }},
              "run_attempt": ${{ toJSON(github.run_attempt) }}
            }
        with:
          script: |
            const run = require(process.env.CACHE_SCRIPT);
            await run({core});

      - name: Build and test package
        env:
          ACTION_PAYLOAD: >-
            {
              "package": ${{ toJSON(inputs.package) }},
              "package_directory": ${{ toJSON(inputs.package-directory || inputs.package) }},
              "python_package": ${{ toJSON(inputs.python-package) }},
              "incoming_packages": ${{ inputs.incoming-packages }},
              "workspace": "$GITHUB_WORKSPACE",
              "temporary_directory": "$RUNNER_TEMP",
              "server_port": 9300,
              "username": "ci",
              "password": "ci",
              "startup_timeout": 60.0,
              "shutdown_timeout": 30.0
            }
        run: |
          python "$CI_SCRIPT" run_ci_package "$ACTION_PAYLOAD"

      - name: Save individual Conan package archive
        if: ${{ !inputs.python-package }}
        uses: actions/github-script@v8
        env:
          ACTION_PAYLOAD: >-
            {
              "operation": "save",
              "package": ${{ toJSON(inputs.package) }},
              "run_id": ${{ toJSON(github.run_id) }},
              "run_attempt": ${{ toJSON(github.run_attempt) }}
            }
        with:
          script: |
            const run = require(process.env.CACHE_SCRIPT);
            await run({core});

      - name: Evict previous package cache entries
        if: ${{ !inputs.python-package && env.ACT != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION_PAYLOAD: >-
            {
              "repository": ${{ toJSON(github.repository) }},
              "cache_prefix": ${{ toJSON(env.CACHE_PREFIX) }},
              "cache_key": ${{ toJSON(env.CACHE_KEY) }},
              "ref": ${{ toJSON(github.ref) }},
              "api_url": ${{ toJSON(github.api_url) }},
              "token_environment": "GH_TOKEN",
              "request_timeout": 30.0
            }
        run: |
          python "$CI_SCRIPT" evict_previous_caches "$ACTION_PAYLOAD"
