name: Build Conan CI image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/docker/conan-ci.Dockerfile
      - .github/workflows/conan_ci_image.yaml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Determine image name
        id: image
        run: |
          echo "name=ghcr.io/${haxscramper,,}/conan-ci" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/conan-ci.Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
