name: Conan package tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: conan-package-cache-${{ github.repository }}
  cancel-in-progress: false

jobs:
  conan-base:
    uses: ./.github/workflows/conan_package_job.yaml
    with:
      package: haxorg_conan_base

  protovalidate:
    needs: conan-base
    uses: ./.github/workflows/conan_package_job.yaml
    with:
      package: protovalidate-cc
      package-directory: repo_conan_wraps/protovalidate-cc
      incoming-package: haxorg_conan_base

  hstd:
    needs: protovalidate
    uses: ./.github/workflows/conan_package_job.yaml
    with:
      package: hstd_cpp_lib
      incoming-package: protovalidate-cc

  text-layout:
    needs: hstd
    uses: ./.github/workflows/conan_package_job.yaml
    with:
      package: hstd_cpp_text_layout
      incoming-package: hstd_cpp_lib

  haxorg:
    needs: text-layout
    uses: ./.github/workflows/conan_package_job.yaml
    with:
      package: haxorg_cpp_org_lib
      incoming-package: hstd_cpp_text_layout

  haxorg-cpp-py-wrap:
    needs: haxorg
    uses: ./.github/workflows/conan_package_job.yaml
    with:
      package: haxorg_cpp_py_wrap
      incoming-package: haxorg_cpp_org_lib

  hstd-py-lib:
    needs: haxorg-cpp-py-wrap
    uses: ./.github/workflows/conan_python_job.yaml
    with:
      package: hstd_py_lib
      incoming-package: haxorg_cpp_py_wrap

  haxorg-py-lib:
    needs: hstd-py-lib
    uses: ./.github/workflows/conan_python_job.yaml
    with:
      package: haxorg_py_lib
      incoming-package: haxorg_cpp_py_wrap
