name: Conan package tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: conan-package-cache-${{ github.repository }}
  cancel-in-progress: false

jobs:
  packages:
    runs-on: ubuntu-latest

    container:
      image: fedora:latest

    defaults:
      run:
        shell: bash

    env:
      UV_PYTHON: "3.13"
      UV_PYTHON_PREFERENCE: only-managed
      UV_PYTHON_DOWNLOADS: automatic

    steps:
      - name: Install system tools
        run: |
          dnf install -y \
            clang \
            gcc-c++ \
            cmake \
            ninja-build \
            python3 \
            python3-pip \
            python3-devel \
            nodejs \
            npm \
            git \
            tar \
            gzip \
            zstd \
            make \
            lldb \
            pkgconf-pkg-config \
            patch

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Python environment and cache client
        run: |
          python3 -m venv "$RUNNER_TEMP/uv-venv"
          "$RUNNER_TEMP/uv-venv/bin/python" -m pip install uv

          UV="$RUNNER_TEMP/uv-venv/bin/uv"

          "$UV" python install "$UV_PYTHON"
          "$UV" venv --clear --python "$UV_PYTHON" "$RUNNER_TEMP/conan-venv"
          "$UV" pip install \
            --python "$RUNNER_TEMP/conan-venv/bin/python" \
            "conan>=2,<3" \
            conan-server

          npm install \
            --prefix "$RUNNER_TEMP/conan-cache-client" \
            --no-package-lock \
            --no-save \
            @actions/cache

          echo "$RUNNER_TEMP/uv-venv/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/conan-venv/bin" >> "$GITHUB_PATH"
          echo "NODE_PATH=$RUNNER_TEMP/conan-cache-client/node_modules" >> "$GITHUB_ENV"

      - name: Run package pipeline
        uses: actions/github-script@v8
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const {spawnSync} = require("node:child_process");

            // JavaScript actions receive the cache service credentials.
            // Pass them through to Python and its cache client.
            const result = spawnSync(
              `${process.env.RUNNER_TEMP}/conan-venv/bin/python`,
              [
                `${process.env.GITHUB_WORKSPACE}/.github/scripts/conan_ci.py`,
                "run_whole_pipeline",
                JSON.stringify({
                  workspace: process.env.GITHUB_WORKSPACE,
                  temporary_directory: process.env.RUNNER_TEMP,
                }),
              ],
              {
                env: process.env,
                stdio: "inherit",
              },
            );

            if (result.error) {
              throw result.error;
            }

            if (result.status !== 0) {
              throw new Error(
                `Package pipeline failed: status=${result.status}, signal=${result.signal}`,
              );
            }
