name: Conan package tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: conan-package-cache-${{ github.repository }}
  cancel-in-progress: false

jobs:
  conan-base:
    uses: ./.github/workflows/conan_package_job.yaml
    with:
      package: haxorg_conan_base

  protovalidate:
    needs: conan-base
    uses: ./.github/workflows/conan_package_job.yaml
    with:
      package: protovalidate-cc
      package-directory: repo_conan_wraps/protovalidate-cc
      incoming-packages: '["haxorg_conan_base"]'

  hstd:
    needs: protovalidate
    uses: ./.github/workflows/conan_package_job.yaml
    with:
      package: hstd_cpp_lib
      incoming-packages: >-
        [
          "haxorg_conan_base",
          "protovalidate-cc"
        ]

  text-layout:
    needs: hstd
    uses: ./.github/workflows/conan_package_job.yaml
    with:
      package: hstd_cpp_text_layout
      incoming-packages: >-
        [
          "haxorg_conan_base",
          "protovalidate-cc",
          "hstd_cpp_lib"
        ]

  haxorg:
    needs: text-layout
    uses: ./.github/workflows/conan_package_job.yaml
    with:
      package: haxorg_cpp_org_lib
      incoming-packages: >-
        [
          "haxorg_conan_base",
          "protovalidate-cc",
          "hstd_cpp_lib",
          "hstd_cpp_text_layout"
        ]

  haxorg-cpp-py-wrap:
    needs: haxorg
    uses: ./.github/workflows/conan_package_job.yaml
    with:
      package: haxorg_cpp_py_wrap
      incoming-packages: >-
        [
          "haxorg_conan_base",
          "protovalidate-cc",
          "hstd_cpp_lib",
          "hstd_cpp_text_layout",
          "haxorg_cpp_org_lib"
        ]

  hstd-py-lib:
    needs: conan-base
    uses: ./.github/workflows/conan_package_job.yaml
    with:
      package: hstd_py_lib
      python-package: true
      incoming-packages: '["haxorg_conan_base"]'

  haxorg-py-lib:
    needs:
      - hstd-py-lib
      - haxorg-cpp-py-wrap
    uses: ./.github/workflows/conan_package_job.yaml
    with:
      package: haxorg_py_lib
      python-package: true
      incoming-packages: >-
        [
          "haxorg_conan_base",
          "protovalidate-cc",
          "hstd_cpp_lib",
          "hstd_cpp_text_layout",
          "haxorg_cpp_org_lib",
          "haxorg_cpp_py_wrap"
        ]
