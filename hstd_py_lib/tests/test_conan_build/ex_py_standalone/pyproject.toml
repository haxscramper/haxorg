[project]
name = "ex_py_standalone"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  # for validation using plugin with LLDB
  "hstd_py_lib",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ex_py_standalone"]
